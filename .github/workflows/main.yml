# Based on the workflows of:
# https://github.com/League-of-Foundry-Developers/FoundryVTT-Module-Template and
# https://github.com/pwatson100/alienrpg
name: Release Creation

on:
  # PRIMARY PATH — pushing a version tag (X.Y.Z) builds and publishes the release
  # with system.json + system.zip. The tag is created on the Gitea side (see
  # RELEASE.md / `npm run release`) and reaches GitHub via the mirror, so it is
  # never pruned. This is the whole release: push a tag, the workflow does the rest.
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  # There is deliberately NO `release: [published]` trigger. It used to be here, from
  # when 0.1.0 was assembled by hand on GitHub. It did not cause the mirror bug -- it
  # HID it: a release made in GitHub's UI creates a GitHub-only tag, this trigger built
  # and attached both assets so everything looked correct, and then the next mirror sync
  # pruned the tag and silently demoted the release to a draft. Without it, a
  # GitHub-made release simply has no assets -- broken immediately and visibly, while
  # you are still looking at it. workflow_dispatch below covers every legitimate rebuild.
  #
  # Manual fallback: (re)build + attach assets to an existing tag from the Actions
  # tab. Use if a tag push somehow didn't fire, or to rebuild a release's assets.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build and attach system.json + system.zip to (e.g. 0.1.0)"
        required: true

# Declared rather than inherited (review #9): the release step needs
# `contents: write`, and without this block it only gets it from the
# repository-level default — a setting held outside the repo. If that default
# is ever tightened to read-only (GitHub's default for new repos), a tag push
# would build, pass every gate, and 403 at publish; and per RELEASE.md the tag
# must not be re-cut on GitHub, so recovery would be a manual dispatch nothing
# points at. The other two workflows already declare theirs.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # One source of truth for the tag across both triggers:
    #   tag push        -> github.ref_name
    #   manual dispatch -> inputs.tag
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # Checkout the RELEASE_TAG's commit on BOTH triggers. A tag push checks out
      # the tag anyway (github.ref); a manual dispatch would otherwise build the
      # BRANCH selected in the Actions UI while labelling the zip with
      # `inputs.tag` — a rebuild of any non-HEAD release shipping newer code
      # under an older number (review #18). `inputs.tag` is empty on a tag push,
      # so the `||` falls through to the pushed ref.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Node is here for the manifest-substitution step and the gates below.
      # There is deliberately NO `npm ci`: this system ships no compendia to
      # build and the gates below need nothing but Node itself, so installing
      # dependencies would add a failure mode (and a registry round-trip) that
      # buys the release nothing.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      # The offline gates, BEFORE anything is published. A tag push used to be
      # able to publish whatever was in the tree, so something must refuse.
      #
      # This is deliberately a SMALL gate. The nine checks that used to sit here
      # were written for a system that shipped 30 compendia, seven item types and
      # seven languages; four of them no longer exist and the rest assert on a
      # shape this fork left behind. A gate that cannot pass is not a gate — it
      # is a tag that never publishes. What survives is what still protects a
      # release: code that parses, and manifests that parse and agree with the
      # files beside them. Add checks back as they earn their place.

      - name: Every module file parses
        run: |
          set -e
          find module -name "*.js" -print0 | xargs -0 -n1 node --check
          echo "module/: syntax OK"

      - name: Manifests parse, and the manifest agrees with the tree
        run: |
          node -e '
            const fs = require("node:fs");
            const m = JSON.parse(fs.readFileSync("system.json", "utf8"));

            // Every declared language file must exist, or Foundry renders raw
            // translation keys at every player with no error anyone can see.
            for (const l of m.languages ?? []) {
              if (!fs.existsSync(l.path)) throw new Error(`system.json declares ${l.path}, which is not in the tree`);
              JSON.parse(fs.readFileSync(l.path, "utf8"));
            }

            // Same for the entry point and the stylesheet.
            for (const f of [...(m.esmodules ?? []), ...(m.styles ?? []).map((x) => x.src)]) {
              if (!fs.existsSync(f)) throw new Error(`system.json declares ${f}, which is not in the tree`);
            }

            // This system ships no compendia. If that ever changes, the zip
            // line below has to learn about packs/ again — so fail loudly here
            // rather than publish a release whose packs are silently absent.
            if ((m.packs ?? []).length) throw new Error("system.json declares packs, but the release zip ships none");

            // Every item and actor type needs a sheet template, or opening one
            // gives a blank window and a 404 in the console.
            for (const t of Object.keys(m.documentTypes?.Item ?? {})) {
              const f = `templates/item/${t}-sheet.html`;
              if (!fs.existsSync(f)) throw new Error(`item type "${t}" has no ${f}`);
            }
            console.log("system.json: OK");
          '

      # microsoft/variable-substitution@v1 this used is ARCHIVED (last push
      # 2023-01) and declares `using: node12` — it ran on 0.1.17 only because
      # GitHub forces retired runtimes onto Node 24, which its changelog ends
      # in the autumn of 2026. The day that stops, a tag push builds, passes
      # every gate above and dies here, and a tag is never re-cut on GitHub
      # (RELEASE.md) — so the recovery would be a workflow edit plus a manual
      # dispatch. Three keys, written back with the file's own 2-space indent.
      - name: Substitute Manifest and Download Links For Versioned Ones
        env:
          REPO: ${{ github.repository }}
        run: |
          node -e '
            const fs = require("node:fs");
            const m = JSON.parse(fs.readFileSync("system.json", "utf8"));
            m.version = process.env.RELEASE_TAG;
            m.manifest = `https://github.com/${process.env.REPO}/releases/latest/download/system.json`;
            m.download = `https://github.com/${process.env.REPO}/releases/download/${process.env.RELEASE_TAG}/system.zip`;
            fs.writeFileSync("system.json", JSON.stringify(m, null, 2) + "\n");
            console.log(`system.json: version ${m.version}, download ${m.download}`);
          '

      # Create a zip file with all files required by the system to add to the release
      # template.json was dropped when the sub-type schemas moved to TypeDataModel
      # (module/data-models.js). zip skips a missing file silently, so this listed a
      # file that had not existed for releases without anyone noticing.
      # packs/ is gone with the compendia: this system reads its content from a
      # module the Warden points it at (see module/content-packs.js), so there
      # is nothing to build and nothing to ship. The manifest gate above fails
      # the release if system.json ever declares packs again.
      - run: zip -r ./system.zip README.md README.es.md LICENSE.txt system.json art/ css/ fonts/ icons/ lang/ logo/ module/ templates/

      # Create/update the release with the built files
      - name: Update Release with Files
        id: create_version_release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true # Set this to false if you want to prevent updating existing releases
          # No `name`/`body` inputs: neither trigger carries them, and the action falls back
          # to the tag for the name. The omit flags then stop an update from blanking notes
          # written by hand on the release page.
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
          draft: false
          # `prerelease: false` applies to NEWLY created releases only. Without the omit
          # flag, allowUpdates would also force an existing release back to false — so
          # rebuilding an old release's assets via workflow_dispatch would silently undo
          # a pre-release marking. 0.1.0-0.1.6 are marked pre-release by hand; this keeps
          # that intact. (ncipollo/release-action: "This will preserve the existing
          # prerelease state during updates.")
          prerelease: false
          omitPrereleaseDuringUpdate: true
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "./system.json, ./system.zip"
          tag: ${{ env.RELEASE_TAG }}
