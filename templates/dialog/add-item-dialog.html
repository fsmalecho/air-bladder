{{!-- A DIV, not a FORM. DialogV2 already renders its content inside its own
      <form>, and the HTML parser silently drops a nested <form> start tag --
      taking this element's class with it. --}}
<div class="custom-dialog">
  <div class="form-group">
    <label>{{localize 'CAIRN.Name'}}:</label>
    <input
      type="text"
      name="itemname"
      value=""
      placeholder="{{localize 'CAIRN.Name'}}"
      data-dtype="String"
    />    
  </div>
  <div class="form-group">
    <label>{{localize 'CAIRN.Type'}}:</label>
    <br />
    <select name="itemtype" class="add-type">
      {{!-- Exactly ONE selected. "item" is the default; this list once carried
            `selected` on two options, and the LAST one wins, so Add Item
            silently created the wrong type.

            `background` is deliberately absent, as it always has been: a
            Trasfondo is not inventory — dropping one on a sheet CHANGES the
            character's background rather than adding a row. --}}
      <option value="item" selected>{{localize 'TYPES.Item.item'}}</option>
      <option value="armor">{{localize 'TYPES.Item.armor'}}</option>
      <option value="weapon">{{localize 'TYPES.Item.weapon'}}</option>
      <option value="book">{{localize 'TYPES.Item.book'}}</option>
      <option value="spell">{{localize 'TYPES.Item.spell'}}</option>
    </select>
  </div>
  <div class="form-group">
    <label>{{localize 'CAIRN.Weightless'}}</label>
    <input type="checkbox" name="itempetty" />
  </div>
</div>
